/* ==========================================================================
   DYSLEXIAQUEST: HAND-DRAWN 2.5D JUNGLE ADVENTURE DESIGN SYSTEM
   Theme: The Lost Canopy of Lexis
   Engineered for inclusive learning, high contrast, and tactile adventure feel.
   ========================================================================== */

:root {
  /* ==================== JUNGLE COLOR PALETTE ==================== */
  --jungle-canopy-deep: #0f3822;       /* hsl(147, 58%, 14%) Deep jungle foliage */
  --jungle-emerald: #1b7340;           /* hsl(145, 62%, 28%) Primary action green */
  --jungle-leaf-vibrant: #38a169;      /* hsl(148, 48%, 42%) Vibrant foliage */
  --jungle-sun-lime: #84cc16;          /* hsl(84, 78%, 44%) Highlight lime */
  --jungle-sun-gold: #f59e0b;          /* hsl(38, 92%, 50%) Golden sunbursts & XP stars */
  --jungle-sun-glow: #fef08a;          /* hsl(54, 98%, 77%) Soft sunbeam glow */
  --jungle-papaya-orange: #ea580c;      /* hsl(22, 90%, 48%) Primary energetic CTA */
  --jungle-amber-bright: #fbbf24;      /* hsl(43, 96%, 56%) Bright coin amber */
  --jungle-sky-blue: #38bdf8;          /* hsl(199, 95%, 60%) Clear tropical sky */
  --jungle-sky-light: #e0f2fe;         /* hsl(204, 88%, 94%) Pale sky tint */
  --jungle-bark-deep: #451a03;         /* hsl(21, 89%, 14%) High-contrast text & outlines */
  --jungle-bark-warm: #78350f;         /* hsl(24, 79%, 26%) Warm carved wood borders */
  --jungle-bark-light: #b45309;        /* hsl(37, 91%, 38%) Lighter wood plank tone */
  --jungle-parchment-bg: #fefae0;      /* hsl(52, 94%, 94%) Warm storybook paper card */
  --jungle-parchment-card: #fffdf2;    /* hsl(48, 100%, 97%) Ultra-clear card surface */
  --jungle-canvas-base: #f7fee7;       /* hsl(80, 85%, 96%) Sunny daytime base background */
  --jungle-berry-coral: #f43f5e;       /* hsl(350, 89%, 60%) Heart counter & voice recording */
  --jungle-orchid-purple: #9333ea;     /* hsl(271, 81%, 56%) Magic spell & memory challenge */

  /* ==================== TYPOGRAPHY TOKENS ==================== */
  --font-display: "Fredoka", "Baloo 2", cursive, sans-serif;
  --font-body: "Lexend", "Nunito", sans-serif;
  --font-dyslexic: "OpenDyslexic", "Lexend", sans-serif;
  --sans: var(--font-body);

  --text-hero: clamp(2.2rem, 4.5vw, 3.8rem);
  --text-h1: clamp(1.8rem, 3.2vw, 2.8rem);
  --text-h2: clamp(1.4rem, 2.2vw, 2rem);
  --text-h3: clamp(1.15rem, 1.8vw, 1.5rem);
  --text-body-large: clamp(1.1rem, 1.4vw, 1.28rem);
  --text-body: clamp(0.98rem, 1.2vw, 1.12rem);
  --text-small: 0.9rem;

  /* Dyslexia readability rules */
  --dyslexic-letter-spacing: 0.035em;
  --dyslexic-word-spacing: 0.1em;
  --dyslexic-line-height: 1.7;

  /* ==================== HAND-DRAWN BORDERS & ELEVATION ==================== */
  --radius-hand-card: 28px 18px 26px 20px / 20px 26px 18px 28px;
  --radius-hand-button: 999px;
  --radius-hand-badge: 16px 22px 14px 20px;
  --radius-hand-pill: 255px 15px 225px 15px / 15px 225px 15px 255px;

  /* Natural tinted shadows */
  --shadow-jungle-subtle: 0 4px 12px rgba(15, 56, 34, 0.08), 0 1px 3px rgba(69, 26, 3, 0.06);
  --shadow-jungle-card: 0 10px 25px -4px rgba(15, 56, 34, 0.12), 0 4px 10px -2px rgba(69, 26, 3, 0.08);
  --shadow-jungle-float: 0 20px 35px -6px rgba(15, 56, 34, 0.18), 0 8px 16px -4px rgba(69, 26, 3, 0.12);
  --shadow-jungle-wood: 0 6px 0 var(--jungle-bark-deep), 0 10px 18px rgba(15, 56, 34, 0.2);
  --shadow-jungle-cta: 0 6px 0 #9a3412, 0 12px 24px rgba(234, 88, 12, 0.35);
  --shadow-jungle-green-btn: 0 5px 0 #0f3822, 0 10px 20px rgba(27, 115, 64, 0.3);

  /* Layer Depths */
  --z-sky: 0;
  --z-canopy-back: 10;
  --z-midground-path: 20;
  --z-foreground-leaves: 30;
  --z-content: 40;
  --z-floating-hud: 50;
  --z-modal: 100;
}

/* Base Body Application */
body {
  font-family: var(--font-body);
  background-color: var(--jungle-canvas-base);
  color: var(--jungle-bark-deep);
  line-height: var(--dyslexic-line-height);
  letter-spacing: var(--dyslexic-letter-spacing);
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

/* ==================== GLOBAL TYPOGRAPHY UTILITIES ==================== */
h1, h2, h3, h4, .font-display {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--jungle-bark-deep);
  line-height: 1.25;
  letter-spacing: 0.01em;
}

p, span, li, button, input {
  font-family: var(--font-body);
}

.dyslexic-font-active,
.dyslexic-font-active * {
  font-family: "OpenDyslexic", "Lexend", sans-serif !important;
  letter-spacing: 0.05em !important;
  word-spacing: 0.12em !important;
  line-height: 1.8 !important;
}

/* ==================== HAND-DRAWN JUNGLE CONTAINER ==================== */
.jungle-app-wrapper {
  position: relative;
  min-height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  background: radial-gradient(circle at 85% 15%, #fef08a 0%, #ecfccb 35%, #f7fee7 70%);
  overflow-x: hidden;
}

/* ==================== SUNLIT PARALLAX JUNGLE STAGE ==================== */
.jungle-ambient-stage {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: var(--z-canopy-back);
  overflow: hidden;
}

/* Sunbeam God-Rays */
.jungle-godray-shaft {
  position: absolute;
  top: -100px;
  right: -50px;
  width: 650px;
  height: 900px;
  background: radial-gradient(ellipse at top right, rgba(254, 240, 138, 0.45) 0%, rgba(254, 240, 138, 0.15) 45%, rgba(254, 240, 138, 0) 75%);
  transform: rotate(-25deg);
  transform-origin: top right;
  filter: blur(14px);
  animation: sunbeamPulse 8s ease-in-out infinite alternate;
  pointer-events: none;
}

.jungle-godray-shaft-secondary {
  position: absolute;
  top: -80px;
  right: 25%;
  width: 400px;
  height: 750px;
  background: linear-gradient(145deg, rgba(254, 240, 138, 0.25) 0%, rgba(254, 240, 138, 0.05) 50%, transparent 80%);
  transform: rotate(-18deg);
  filter: blur(18px);
  animation: sunbeamPulse 11s ease-in-out infinite alternate-reverse;
  pointer-events: none;
}

/* Floating Spores Canvas */
.jungle-spores-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* Hanging Canopy Vines & Foliage */
.jungle-foliage-corner-tl {
  position: fixed;
  top: -20px;
  left: -20px;
  width: 320px;
  height: 280px;
  pointer-events: none;
  z-index: var(--z-foreground-leaves);
  transform-origin: 10% 0%;
  animation: swayLeafLeft 6.5s ease-in-out infinite alternate;
}

.jungle-foliage-corner-tr {
  position: fixed;
  top: -25px;
  right: -20px;
  width: 360px;
  height: 300px;
  pointer-events: none;
  z-index: var(--z-foreground-leaves);
  transform-origin: 90% 0%;
  animation: swayLeafRight 7.5s ease-in-out infinite alternate;
}

.jungle-foliage-bottom-leaves {
  position: fixed;
  bottom: -40px;
  left: 0;
  width: 100%;
  height: 160px;
  pointer-events: none;
  z-index: var(--z-foreground-leaves);
  display: flex;
  justify-content: space-between;
  opacity: 0.85;
}

/* ==================== BUTTONS: CHUNKY WOOD & PAPAYA ==================== */
.btn-jungle-cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 32px;
  font-family: var(--font-display);
  font-size: 1.22rem;
  font-weight: 700;
  color: #ffffff;
  background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
  border: 3px solid #7c2d12;
  border-radius: var(--radius-hand-pill);
  box-shadow: var(--shadow-jungle-cta);
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
  user-select: none;
  text-decoration: none;
}

.btn-jungle-cta:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 9px 0 #9a3412, 0 16px 28px rgba(234, 88, 12, 0.45);
}

.btn-jungle-cta:active {
  transform: translateY(4px) scale(0.98);
  box-shadow: 0 2px 0 #9a3412, 0 6px 12px rgba(234, 88, 12, 0.25);
}

.btn-jungle-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 28px;
  font-family: var(--font-display);
  font-size: 1.12rem;
  font-weight: 700;
  color: #ffffff;
  background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
  border: 3px solid var(--jungle-canopy-deep);
  border-radius: var(--radius-hand-pill);
  box-shadow: var(--shadow-jungle-green-btn);
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;
  user-select: none;
}

.btn-jungle-secondary:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 8px 0 var(--jungle-canopy-deep), 0 14px 24px rgba(27, 115, 64, 0.35);
}

.btn-jungle-secondary:active {
  transform: translateY(3px) scale(0.98);
  box-shadow: 0 2px 0 var(--jungle-canopy-deep), 0 6px 12px rgba(27, 115, 64, 0.2);
}

.btn-jungle-wood {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  color: #fffdf2;
  background: linear-gradient(180deg, #92400e 0%, #78350f 100%);
  border: 2px solid var(--jungle-bark-deep);
  border-radius: var(--radius-hand-badge);
  box-shadow: 0 4px 0 var(--jungle-bark-deep), 0 6px 14px rgba(69, 26, 3, 0.2);
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.btn-jungle-wood:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--jungle-bark-deep), 0 10px 18px rgba(69, 26, 3, 0.25);
}

.btn-jungle-wood:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--jungle-bark-deep), 0 4px 8px rgba(69, 26, 3, 0.15);
}

/* ==================== PARCHMENT CARDS & PANELS ==================== */
.jungle-parchment-card {
  position: relative;
  background: var(--jungle-parchment-card);
  border: 3px solid var(--jungle-bark-warm);
  border-radius: var(--radius-hand-card);
  box-shadow: var(--shadow-jungle-card);
  padding: 32px;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
}

.jungle-parchment-card::before {
  content: "";
  position: absolute;
  top: 6px;
  left: 6px;
  right: 6px;
  bottom: 6px;
  border: 1.5px dashed rgba(120, 53, 15, 0.28);
  border-radius: inherit;
  pointer-events: none;
}

/* ==================== EXPEDITION MAP & QUEST NODES ==================== */
.quest-trail-container {
  position: relative;
  width: 100%;
  max-width: 1300px;
  margin: 0 auto;
  padding: 40px 24px 100px;
  z-index: var(--z-content);
}

.quest-station-card {
  position: relative;
  background: var(--jungle-parchment-card);
  border: 3.5px solid var(--jungle-bark-warm);
  border-radius: var(--radius-hand-card);
  box-shadow: var(--shadow-jungle-card);
  padding: 24px;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
}

.quest-station-card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: var(--shadow-jungle-float);
  border-color: var(--jungle-emerald);
}

.quest-station-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: var(--jungle-canvas-base);
  border: 2px solid var(--jungle-emerald);
  border-radius: var(--radius-hand-pill);
  font-family: var(--font-display);
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--jungle-emerald);
  width: fit-content;
}

.quest-station-icon-orb {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
  font-size: 28px;
  transition: transform 0.2s ease;
}

.quest-station-card:hover .quest-station-icon-orb {
  transform: scale(1.1) rotate(5deg);
}

/* ==================== TACTILE ANSWER STONES ==================== */
.answer-stone-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 20px;
  width: 100%;
  margin: 28px 0;
}

.answer-stone {
  position: relative;
  min-height: 96px;
  padding: 20px;
  background: #ffffff;
  border: 3.5px solid var(--jungle-bark-warm);
  border-radius: var(--radius-hand-card);
  box-shadow: 0 6px 0 var(--jungle-bark-warm), 0 10px 18px rgba(69, 26, 3, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--jungle-bark-deep);
  cursor: pointer;
  user-select: none;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease;
}

.answer-stone:hover {
  transform: translateY(-4px);
  background: var(--jungle-parchment-bg);
  box-shadow: 0 10px 0 var(--jungle-bark-warm), 0 14px 22px rgba(69, 26, 3, 0.18);
  border-color: var(--jungle-emerald);
}

.answer-stone:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 var(--jungle-bark-warm), 0 4px 8px rgba(69, 26, 3, 0.1);
}

.answer-stone.correct {
  background: linear-gradient(180deg, #dcfce7 0%, #bbf7d0 100%);
  border-color: #15803d;
  box-shadow: 0 6px 0 #15803d, 0 10px 20px rgba(21, 128, 61, 0.35);
  color: #14532d;
  transform: scale(1.04);
}

.answer-stone.incorrect {
  background: #fee2e2;
  border-color: #b91c1c;
  color: #7f1d1d;
  box-shadow: 0 4px 0 #b91c1c;
}

/* ==================== VIBRANT KEYFRAME ANIMATIONS ==================== */
@keyframes sunbeamPulse {
  0% { opacity: 0.25; transform: rotate(-25deg) scale(0.98); }
  100% { opacity: 0.45; transform: rotate(-22deg) scale(1.03); }
}

@keyframes swayLeafLeft {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(3.8deg); }
}

@keyframes swayLeafRight {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-3.5deg); }
}

@keyframes gentleBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
  50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.85); }
}

/* ==================== ACCESSIBILITY: REDUCED MOTION ==================== */
@media (prefers-reduced-motion: reduce) {

}

/* =========================================================

   DESIGN SYSTEM TOKENS - JUNGLE ADVENTURE THEME

   ========================================================= */

:root {

  --font-sans: 'Lexend', 'Nunito', sans-serif;

  --font-dyslexic: 'OpenDyslexic', 'Lexend', sans-serif;



  /* Sunny Jungle Daybreak */

  --slate-50: #f7fee7;

  --slate-100: #ecfccb;

  --slate-200: #fefae0;

  --slate-300: #fed7aa;

  --slate-400: #fbbf24;

  --slate-500: #b45309;

  --slate-600: #92400e;

  --slate-700: #78350f;

  --slate-800: #5c2207;

  --slate-900: #451a03;



  /* Primary Brand (Jungle Emerald & Bark) */

  --primary: #16a34a;

  --primary-hover: #15803d;

  --primary-active: #14532d;

  --primary-bg: #dcfce7;

  --primary-border: #16a34a;



  --brand: #ea580c;

  --brand-hover: #c2410c;

  --brand-bg: #ffedd5;

  --brand-border: #ea580c;



  /* Functional Status Colors */

  --success: #16a34a;

  --success-hover: #15803d;

  --success-bg: #dcfce7;

  --success-border: #22c55e;



  --warning: #f59e0b;

  --warning-bg: #fef3c7;

  --warning-border: #f59e0b;



  --danger: #e11d48;

  --danger-hover: #be123c;

  --danger-bg: #ffe4e6;

  --danger-border: #f43f5e;



  /* Surfaces & Borders (Warm Storybook Parchment & Wood) */

  --surface: #fffdf2;

  --surface-alt: #fefae0;

  --border: #78350f;

  --border-focus: #16a34a;



  /* Typography */

  --text-main: #451a03;

  --text-secondary: #78350f;

  --text-muted: #92400e;



  /* Shadows (Tactile Wood & Papercraft) */

  --shadow-xs: 0 2px 0 #78350f;

  --shadow-sm: 0 4px 0 #78350f, 0 6px 14px rgba(69, 26, 3, 0.08);

  --shadow-md: 0 6px 0 #78350f, 0 10px 22px rgba(69, 26, 3, 0.12);

  --shadow-lg: 0 8px 0 #78350f, 0 16px 32px rgba(69, 26, 3, 0.16);

  --shadow-xl: 0 12px 0 #78350f, 0 24px 44px rgba(69, 26, 3, 0.2);



  /* Radii */

  --radius-sm: 12px;

  --radius-md: 18px;

  --radius-lg: 24px;

  --radius-xl: 32px;

  --radius-full: 9999px;



  --transition: all 180ms cubic-bezier(0.34, 1.56, 0.64, 1);

}



/* =========================================================

   GLOBAL RESET & ACCESSIBLE TYPOGRAPHY

   ========================================================= */

* {

  box-sizing: border-box;

}



body {

  margin: 0;

  padding: 0;

  font-family: var(--font-sans);

  background-color: var(--slate-50);

  color: var(--text-main);

  line-height: 1.6;

  -webkit-font-smoothing: antialiased;

  -moz-osx-font-smoothing: grayscale;

}



button, input, select, textarea {

  font-family: inherit;

}



button {

  cursor: pointer;

  border: none;

  background: none;

  font-size: inherit;

  color: inherit;

  transition: var(--transition);

}



button:focus-visible, input:focus-visible {

  outline: 2px solid var(--primary);

  outline-offset: 2px;

}



/* =========================================================

   APP LAYOUT & WRAPPERS

   ========================================================= */

.app {

  min-height: 100vh;

  display: flex;

  flex-direction: column;

  background-color: var(--slate-50);

  position: relative;

}



.page {

  width: 100%;

  max-width: 1080px;

  margin: 0 auto;

  padding: 24px 20px 60px;

  display: flex;

  flex-direction: column;

}



/* Top Navigation Bar */

.top-bar {

  display: flex;

  align-items: center;

  justify-content: space-between;

  margin-bottom: 24px;

  padding-bottom: 16px;

  border-bottom: 1px solid var(--slate-200);

}



.back-button {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  padding: 8px 16px;

  font-size: 14px;

  font-weight: 600;

  color: var(--slate-700);

  background-color: var(--surface);

  border: 1px solid var(--slate-300);

  border-radius: var(--radius-sm);

  box-shadow: var(--shadow-xs);

}



.back-button:hover {

  background-color: var(--slate-100);

  color: var(--slate-900);

  border-color: var(--slate-400);

}



.score-display {

  display: inline-flex;

  align-items: center;

  gap: 6px;

  padding: 6px 14px;

  font-size: 13px;

  font-weight: 700;

  font-variant-numeric: tabular-nums;

  background: var(--brand-bg);

  color: var(--brand);

  border: 1px solid var(--brand-border);

  border-radius: var(--radius-full);

}



/* =========================================================

   HERO / WELCOME HEADER

   ========================================================= */

.hero {

  text-align: center;

  padding: 32px 20px 24px;

  max-width: 760px;

  margin: 0 auto 24px;

}



.brain {

  width: 56px;

  height: 56px;

  margin: 0 auto 16px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: var(--brand-bg);

  color: var(--brand);

  border-radius: var(--radius-md);

  border: 1px solid var(--brand-border);

}



.eyebrow {

  font-size: 12px;

  font-weight: 700;

  letter-spacing: 0.08em;

  text-transform: uppercase;

  color: var(--brand);

  margin-bottom: 8px;

}



.hero h1 {

  font-size: 32px;

  font-weight: 800;

  color: var(--slate-900);

  letter-spacing: -0.02em;

  line-height: 1.25;

  margin: 0 0 12px;

}



.hero-subtitle {

  font-size: 14px;

  font-weight: 700;

  letter-spacing: 0.05em;

  text-transform: uppercase;

  color: var(--slate-500);

  margin-bottom: 12px;

}



.hero-description {

  font-size: 16px;

  color: var(--slate-600);

  line-height: 1.6;

  margin: 0 auto;

}



/* =========================================================

   CARD CONTAINERS - HAND-DRAWN PARCHMENT

   ========================================================= */

.card, .stage-card, .complete-card, .stages-card, .analysis-card {

  background: var(--surface);

  border: 3.5px solid var(--border);

  border-radius: var(--radius-hand-card);

  box-shadow: var(--shadow-jungle-card);

  padding: 38px 34px;

  margin-bottom: 28px;

  position: relative;

}



.card h2, .stage-card h1, .complete-card h1, .stages-header h1 {

  font-family: var(--font-display);

  font-size: 26px;

  font-weight: 800;

  color: var(--slate-900);

  letter-spacing: 0.01em;

  margin: 0 0 10px;

}



.section-description, .stage-description {

  font-size: 16px;

  color: var(--slate-700);

  margin-bottom: 24px;

  line-height: 1.65;

}



/* =========================================================

   MODULES / STAGES SELECTION GRID

   ========================================================= */

.stages-header {

  text-align: center;

  margin-bottom: 32px;

}



.stages-header h1 {

  font-size: 28px;

}



.saved-progress-card {

  background: var(--slate-50);

  border: 1px solid var(--slate-200);

  border-radius: var(--radius-md);

  padding: 18px 22px;

  margin: 20px auto 0;

  max-width: 600px;

  text-align: left;

  font-size: 14px;

  color: var(--slate-700);

}



.saved-progress-card strong {

  display: flex;

  align-items: center;

  gap: 6px;

  font-size: 13px;

  letter-spacing: 0.04em;

  text-transform: uppercase;

  color: var(--slate-500);

  margin-bottom: 10px;

}



.saved-progress-card p {

  margin: 6px 0;

  font-variant-numeric: tabular-nums;

  font-weight: 500;

}



.stage-grid {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));

  gap: 24px;

  margin-top: 24px;

}



.stage-option {

  background: var(--surface);

  border: 3.5px solid var(--border);

  border-radius: var(--radius-hand-card);

  padding: 30px 26px;

  display: flex;

  flex-direction: column;

  align-items: flex-start;

  text-align: left;

  box-shadow: var(--shadow-jungle-card);

  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;

  position: relative;

}



.stage-option:hover {

  transform: translateY(-6px) scale(1.01);

  border-color: var(--primary);

  box-shadow: var(--shadow-jungle-float);

}



.realm-pill {

  display: inline-flex;

  align-items: center;

  padding: 4px 12px;

  font-family: var(--font-display);

  font-size: 12px;

  font-weight: 800;

  letter-spacing: 0.05em;

  text-transform: uppercase;

  border-radius: var(--radius-full);

  background: var(--slate-100);

  color: var(--slate-800);

  border: 2px solid var(--border);

  margin-bottom: 16px;

}



.stage-number {

  width: 52px;

  height: 52px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #ffedd5;

  color: #ea580c;

  border-radius: 50%;

  border: 2.5px solid #ea580c;

  box-shadow: 0 3px 0 #c2410c;

  margin-bottom: 16px;

}



.stage-number::after {

  display: none !important;

}



.stage-option h2 {

  font-family: var(--font-display);

  font-size: 22px;

  font-weight: 800;

  color: var(--slate-900);

  margin: 0 0 6px;

}



.realm-tagline {

  font-size: 14px;

  font-weight: 700;

  color: var(--slate-700);

  margin-bottom: 8px;

}



.stage-option p {

  font-size: 14px;

  color: var(--slate-700);

  line-height: 1.5;

  margin: 0 0 16px;

}



.analysis-note {

  background: var(--slate-50);

  border: 1px solid var(--slate-200);

  border-radius: var(--radius-sm);

  padding: 12px 14px;

  font-size: 13px;

  color: var(--slate-700);

  line-height: 1.6;

  width: 100%;

  margin-bottom: 20px;

}



/* =========================================================

   BUTTONS - CHUNKY WOOD & PAPAYA CTA

   ========================================================= */

.primary-button, .save-button {

  width: 100%;

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  padding: 14px 24px;

  font-family: var(--font-display);

  font-size: 1.1rem;

  font-weight: 800;

  color: #ffffff;

  background: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);

  border: 2.5px solid #7c2d12;

  border-radius: var(--radius-hand-pill);

  box-shadow: 0 5px 0 #7c2d12, 0 8px 18px rgba(234, 88, 12, 0.3);

  margin-top: auto;

  cursor: pointer;

  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease;

  user-select: none;

}



.primary-button:hover, .save-button:hover {

  transform: translateY(-3px) scale(1.02);

  box-shadow: 0 8px 0 #7c2d12, 0 14px 24px rgba(234, 88, 12, 0.4);

}



.primary-button:active, .save-button:active {

  transform: translateY(3px) scale(0.98);

  box-shadow: 0 2px 0 #7c2d12;

}



.secondary-button {

  display: inline-flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  padding: 12px 22px;

  font-family: var(--font-display);

  font-size: 1rem;

  font-weight: 700;

  color: var(--slate-800);

  background: #fefae0;

  border: 2.5px solid var(--border);

  border-radius: var(--radius-hand-pill);

  box-shadow: 0 4px 0 var(--border);

  margin-top: 10px;

  cursor: pointer;

  transition: transform 0.15s ease;

}



.secondary-button:hover {

  transform: translateY(-2px);

  background: #fef08a;

}



.small-button {

  padding: 6px 12px;

  font-size: 12px;

  font-weight: 600;

  border-radius: var(--radius-sm);

  border: 1px solid var(--slate-300);

  background: var(--surface);

  color: var(--slate-700);

}



.small-button.danger {

  color: var(--danger);

  border-color: var(--danger-border);

  background: var(--danger-bg);

}



.small-button.danger:hover {

  background: #ffe4e6;

}



.next-button {

  margin-top: 24px;

}



/* =========================================================

   LEVEL TABS & PROGRESS BAR

   ========================================================= */

.level-tabs {

  display: flex;

  gap: 8px;

  background: var(--slate-100);

  padding: 6px;

  border-radius: var(--radius-md);

  margin-bottom: 24px;

  border: 1px solid var(--slate-200);

  overflow-x: auto;

}



.level-tab {

  flex: 1;

  min-width: 100px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 8px;

  padding: 10px 14px;

  border-radius: var(--radius-sm);

  font-size: 13px;

  font-weight: 600;

  color: var(--slate-600);

  background: transparent;

  transition: var(--transition);

}



.level-tab.active {

  background: var(--surface);

  color: var(--slate-900);

  box-shadow: var(--shadow-xs);

}



.level-tab.completed {

  color: var(--success);

}



.progress-area {

  margin: 20px 0;

}



.progress-label {

  display: flex;

  justify-content: space-between;

  font-size: 13px;

  font-weight: 600;

  color: var(--slate-600);

  margin-bottom: 8px;

  font-variant-numeric: tabular-nums;

}



.progress-track {

  width: 100%;

  height: 8px;

  background: var(--slate-200);

  border-radius: var(--radius-full);

  overflow: hidden;

}



.progress-fill {

  height: 100%;

  background: var(--primary);

  border-radius: var(--radius-full);

  transition: width 300ms ease;

}



/* =========================================================

   QUESTION & INTERACTIVE ANSWER GRID (CLINICAL TERMINAL HUD)

   ========================================================= */

.exercise-card {

  margin: 28px 0;

  padding: 32px 28px;

  background: rgba(15, 23, 42, 0.8);

  backdrop-filter: blur(16px);

  -webkit-backdrop-filter: blur(16px);

  border: 1px solid rgba(56, 189, 248, 0.25);

  border-radius: 20px;

  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);

  text-align: center;

  position: relative;

}



.big-letter {

  font-size: 88px;

  font-weight: 900;

  color: #ffffff;

  line-height: 1.1;

  margin: 24px auto;

  font-family: var(--font-dyslexic);

  letter-spacing: 0.06em;

  text-shadow: 0 0 30px rgba(56, 189, 248, 0.6), 0 0 60px rgba(129, 140, 248, 0.35);

  display: inline-block;

  padding: 14px 44px;

  background: rgba(9, 13, 22, 0.75);

  border: 1px solid rgba(56, 189, 248, 0.35);

  border-radius: 18px;

  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);

}



.answer-grid, .answer-options, .stage3-options {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

  gap: 16px;

  margin: 28px 0;

}



.answer-grid button, .answer-options button, .stage3-options button {

  min-height: 74px;

  padding: 18px 26px;

  font-size: 1.35rem;

  font-weight: 800;

  font-family: var(--font-dyslexic);

  background: #ffffff;

  color: var(--slate-900);

  border: 3.5px solid var(--border);

  border-radius: 20px;

  box-shadow: 0 6px 0 var(--border), 0 8px 16px rgba(69, 26, 3, 0.1);

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 12px;

  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease;

  cursor: pointer;

  position: relative;

  overflow: hidden;

}



.answer-grid button:hover:not(:disabled),

.answer-options button:hover:not(:disabled),

.stage3-options button:hover:not(:disabled) {

  border-color: var(--primary);

  background: var(--jungle-parchment-bg);

  color: var(--slate-900);

  transform: translateY(-4px);

  box-shadow: 0 10px 0 var(--border), 0 14px 24px rgba(69, 26, 3, 0.18);

}



.answer-grid button:active:not(:disabled),

.answer-options button:active:not(:disabled),

.stage3-options button:active:not(:disabled) {

  transform: translateY(4px);

  box-shadow: 0 2px 0 var(--border);

}



.answer-grid button.correct,

.answer-options button.correct {

  border-color: #16a34a !important;

  background: #dcfce7 !important;

  color: #14532d !important;

  box-shadow: 0 6px 0 #16a34a !important;

  transform: scale(1.03);

}



.answer-grid button.wrong,

.answer-options button.wrong {

  border-color: #e11d48 !important;

  background: #ffe4e6 !important;

  color: #9f1239 !important;

  box-shadow: 0 4px 0 #e11d48 !important;

}



.answer-grid button:disabled,

.answer-options button:disabled,

.stage3-options button:disabled {

  cursor: default;

}



/* Feedback Notifications */

.feedback {

  margin: 20px 0;

  padding: 16px 24px;

  border-radius: 12px;

  font-size: 15px;

  font-weight: 700;

  text-align: center;

  letter-spacing: 0.04em;

  text-transform: uppercase;

  font-family: monospace;

  backdrop-filter: blur(12px);

  -webkit-backdrop-filter: blur(12px);

}



.correct-feedback {

  background: rgba(16, 185, 129, 0.15);

  color: #10b981;

  border: 1px solid rgba(16, 185, 129, 0.4);

  box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);

}



.wrong-feedback {

  background: rgba(244, 63, 94, 0.15);

  color: #f43f5e;

  border: 1px solid rgba(244, 63, 94, 0.4);

  box-shadow: 0 0 25px rgba(244, 63, 94, 0.2);

}



/* Shape Display Card */

.shape-display-card {

  margin: 20px 0;

  padding: 28px;

  background: rgba(9, 13, 22, 0.85);

  border: 1px solid rgba(56, 189, 248, 0.25);

  border-radius: 18px;

  box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.6);

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}



.shape-fact-card {

  margin-top: 18px;

  padding: 18px 22px;

  background: rgba(245, 158, 11, 0.08);

  border: 1px solid rgba(245, 158, 11, 0.3);

  border-radius: 14px;

  text-align: left;

  backdrop-filter: blur(12px);

}



.shape-fact-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  margin-bottom: 8px;

}



.shape-fact-title {

  font-size: 12px;

  font-weight: 800;

  color: #f59e0b;

  text-transform: uppercase;

  letter-spacing: 0.08em;

}



.shape-fact-audio-btn {

  display: inline-flex;

  align-items: center;

  gap: 6px;

  padding: 6px 14px;

  font-size: 12px;

  font-weight: 700;

  background: rgba(255, 255, 255, 0.05);

  color: #f8fafc;

  border: 1px solid rgba(255, 255, 255, 0.15);

  border-radius: 8px;

  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);

  cursor: pointer;

  transition: all 0.15s ease;

}



.shape-fact-audio-btn:hover {

  background: rgba(255, 255, 255, 0.12);

  color: #ffffff;

  border-color: rgba(245, 158, 11, 0.4);

}



.shape-fact-body {

  font-size: 14px;

  color: #cbd5e1;

  line-height: 1.6;

}



/* Hint Panel */

.hint-panel {

  margin: 18px 0;

  padding: 16px 22px;

  background: rgba(56, 189, 248, 0.08);

  border: 1px solid rgba(56, 189, 248, 0.25);

  border-radius: 14px;

  text-align: left;

  color: #cbd5e1;

  backdrop-filter: blur(12px);

}



/* Voice Quest Specific */

.voice-section {

  text-align: center;

  padding: 32px 24px;

  background: rgba(15, 23, 42, 0.75);

  border-radius: 18px;

  border: 1px solid rgba(244, 63, 94, 0.3);

  margin: 24px 0;

  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);

  backdrop-filter: blur(16px);

}



.voice-prompt {

  font-size: 32px;

  font-weight: 800;

  color: #ffffff;

  margin-bottom: 20px;

  font-family: var(--font-dyslexic);

  text-shadow: 0 0 20px rgba(244, 63, 94, 0.5);

}



.reading-record-box {

  margin: 20px 0;

}



.recording-dot {

  width: 12px;

  height: 12px;

  background-color: var(--danger);

  border-radius: 50%;

  display: inline-block;

  animation: pulse 3s infinite ease-in-out;

  margin-right: 8px;

  box-shadow: 0 0 6px rgba(244, 63, 94, 0.4);

}



@keyframes pulse {

  0%, 100% { transform: scale(1); opacity: 0.85; }

  50% { transform: scale(1.1); opacity: 1; }

}



.spoken-result {

  font-size: 20px;

  font-weight: 700;

  color: var(--primary);

  margin: 14px 0;

  font-family: monospace;

  letter-spacing: 0.04em;

}



.reading-accuracy {

  font-size: 14px;

  font-weight: 800;

  color: #10b981;

  letter-spacing: 0.06em;

  text-transform: uppercase;

}



/* =========================================================

   STUDENT PROFILE FORM

   ========================================================= */

.form-section {

  margin: 24px 0;

  text-align: left;

}



.form-section h3 {

  font-size: 16px;

  font-weight: 700;

  color: var(--slate-900);

  letter-spacing: -0.01em;

  margin-bottom: 16px;

  padding-bottom: 8px;

  border-bottom: 1px solid var(--slate-200);

}



.form-grid {

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

  gap: 16px;

}



.form-group {

  display: flex;

  flex-direction: column;

  gap: 6px;

}



.form-group.full-width {

  grid-column: 1 / -1;

}



.form-group label {

  font-size: 12px;

  font-weight: 700;

  color: var(--slate-600);

  letter-spacing: 0.05em;

  text-transform: uppercase;

}



.form-group input, .form-group select {

  padding: 11px 14px;

  font-size: 14px;

  color: var(--slate-900);

  background: var(--surface);

  border: 1px solid var(--slate-300);

  border-radius: var(--radius-sm);

  box-shadow: var(--shadow-xs);

  transition: var(--transition);

}



.form-group input:focus, .form-group select:focus {

  border-color: var(--primary);

  outline: none;

  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);

}



.profile-photo-section {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 14px;

  margin-bottom: 28px;

}



.photo-preview {

  width: 96px;

  height: 96px;

  border-radius: var(--radius-full);

  background: var(--slate-100);

  border: 2px dashed var(--slate-300);

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  color: var(--slate-400);

}



.photo-preview img {

  width: 100%;

  height: 100%;

  object-fit: cover;

}



.upload-button {

  display: inline-flex;

  align-items: center;

  gap: 8px;

  padding: 9px 16px;

  font-size: 13px;

  font-weight: 600;

  color: var(--slate-700);

/* ==========================================================================
   CINEMATIC 3D NEURAL CANVAS & MOFFETT AI HUD CALLOUTS
   ========================================================================== */
.cinematic-canvas-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 480px;
  overflow: hidden;
  background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, rgba(4, 7, 17, 0.95) 100%);
}

.neural-callout {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  cursor: pointer;
  z-index: 25;
  transition: transform 0.12s ease-out;
  user-select: none;
}

.callout-line {
  width: 32px;
  height: 1px;
  background: linear-gradient(90deg, #2dd4bf, transparent);
  margin-bottom: 2px;
}

.callout-content {
  background: rgba(9, 13, 22, 0.88);
  border: 1px solid rgba(45, 212, 191, 0.32);
  border-radius: 10px;
  padding: 6px 12px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 12px rgba(45, 212, 191, 0.15);
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  min-width: 140px;
}

.callout-tag {
  font-size: 0.62rem;
  font-family: monospace;
  font-weight: 800;
  color: #2dd4bf;
  letter-spacing: 0.08em;
  display: block;
}

.callout-title {
  font-size: 0.82rem;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.15;
  display: block;
  margin: 2px 0 1px;
}

.callout-desc {
  font-size: 0.68rem;
  color: #94a3b8;
  margin: 0;
}

.neural-callout:hover .callout-content,
.neural-callout.active .callout-content {
  border-color: #2dd4bf;
  background: rgba(15, 23, 42, 0.95);
  box-shadow: 0 0 16px rgba(45, 212, 191, 0.3), 0 12px 30px rgba(0, 0, 0, 0.8);
  transform: scale(1.05);
}

.tactical-inversion-overlay {
  position: absolute;
  bottom: 16px;
  left: 20px;
  right: 20px;
  background: rgba(9, 13, 22, 0.88);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 14px;
  padding: 12px 18px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  z-index: 30;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
}

.inversion-hud-header {
  display: flex;

}

.inversion-slider-row {

.slider-edge-label {
